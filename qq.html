<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 - QQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .qr-code {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 16px;
            margin: 0 auto 16px;
            display: block;
            background: #fff;
            padding: 12px;
        }
        .tip {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="pic/qq.png" alt="QQ二维码" class="qr-code">
        <p class="tip"> 扫一扫加我 QQ</p>
        <a href="index.html" class="back-link">← 返回主页</a>
    </div>
</body>
</html>
